<html lang="en">
<head>

<style>
*{box-sizing:border-box}
:root{--bg:#F5F5F7;--card:#FFFFFF;--card2:#EEF0F4;--ink:#111827;--ink2:#5B6472;--line:#E2E6EC;--brand:#133DD6;--brand2:#0D7BFF;--good:#15803D;--bad:#B91C1C;--warn:#92400E;--radius:20px;--shadow:0 8px 28px rgba(17,24,39,.08)}
body[data-theme="dark"]{--bg:#0B0F1A;--card:#151C2E;--card2:#1D2740;--ink:#F4F7FB;--ink2:#9AA6BB;--line:#26314A;--shadow:0 12px 32px rgba(0,0,0,.45)}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans Myanmar",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1060px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1800AD,#133DD6,#0D7BFF);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.logo-mark svg{width:22px;height:22px}
.topbar h1{font-size:19px;margin:0;letter-spacing:-.01em}
.topbar small{display:block;font-size:12px;color:var(--ink2);font-weight:500}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
main{max-width:1060px;margin:0 auto;padding:20px 16px 110px}
h2{font-size:26px;letter-spacing:-.02em;margin:8px 0 6px}
h3{font-size:19px;margin:22px 0 8px}
h4{font-size:16px;margin:14px 0 6px}
p{line-height:1.6;color:var(--ink2);font-size:15px}
p strong{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr 1fr}}
.btn{min-height:46px;border:0;border-radius:14px;padding:0 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s ease,filter .15s ease;background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#1800AD,#133DD6,#0D7BFF);color:#fff;border:0}
.btn-primary:hover{filter:brightness(1.08)}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:11px}
.input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 13px;font-size:15px}
label{font-size:13px;font-weight:600;color:var(--ink2);display:block;margin:12px 0 5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good)} .pill.lock{color:var(--ink2)} .pill.cur{color:var(--brand)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs-in{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;color:var(--ink2);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--brand)}
@media(min-width:900px){
  .tabs{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:0}
  .tabs-in{display:flex;gap:4px;align-items:center;padding:0 16px;height:60px}
  .tab{flex-direction:row;font-size:14px;padding:8px 14px}
  main{padding-top:84px}
  .topbar{display:none}
}
.progress-track{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#133DD6,#0D7BFF);border-radius:99px;transition:width .45s ease}
.ring{width:64px;height:64px;flex:none}
.word-row{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.word-row:first-child{border-top:0}
.word-big{font-size:20px;font-weight:700;line-height:1.3}
.word-gloss{font-size:14px;color:var(--ink2)}
.word-hint{font-size:13px;color:var(--brand);font-weight:600}
.lesson-row{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--card);width:100%;text-align:left;color:var(--ink)}
.lesson-row:disabled{opacity:.55;cursor:not-allowed}
.lesson-row .t{flex:1;min-width:0}
.lesson-row .t b{display:block;font-size:15px}
.lesson-row .t span{font-size:13px;color:var(--ink2)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,8,18,.5);display:none;align-items:flex-end;justify-content:center;padding:12px}
.sheet.open{display:flex}
.sheet-box{background:var(--card);color:var(--ink);border-radius:24px 24px 16px 16px;width:100%;max-width:680px;max-height:88vh;overflow:auto;padding:20px}
@media(min-width:700px){.sheet{align-items:center}.sheet-box{border-radius:24px}}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);margin:8px 0;font-size:15px}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--card))}
.opt.right{border-color:var(--good);background:color-mix(in srgb,#15803D 10%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,#B91C1C 10%,var(--card))}
.bar{display:flex;gap:8px;align-items:flex-end;height:72px}
.bar i{flex:1;background:var(--brand2);border-radius:6px 6px 0 0;min-height:4px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .card{padding:14px}
.stat b{font-size:24px;display:block}
.stat span{font-size:13px;color:var(--ink2)}
.note{font-size:13px;color:var(--ink2);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:80;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
details{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);margin:10px 0}
details summary{font-weight:700;cursor:pointer;font-size:15px}
.kbd{font-size:12px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

function lessonMeta(code,level,idx){
  var kinds=[["vocab","Vocabulary 1"],["vocab","Vocabulary 2"],["grammar","Grammar 1"],["grammar","Grammar 2"],["grammar","Grammar 3"],["reading","Reading"],["listening","Listening and Speaking"]];

function allLessons(code,level){var out=[];for(var i=0;i<7;i++)out.push(lessonMeta(code,level,i));return out;}
function levelUnlocked(code,level){
  var i=LEVEL_ORDER.indexOf(level);if(i===0)return true;
  return !!langState(code).examPass[LEVEL_ORDER[i-1]];
}
function lessonUnlocked(code,level,idx){
  if(!levelUnlocked(code,level))return false;if(idx===0)return true;
  return langState(code).doneLessons.indexOf(lessonId(code,level,idx-1))>=0;
}
function currentLevel(code){
  for(var i=0;i<LEVEL_ORDER.length;i++){if(!langState(code).examPass[LEVEL_ORDER[i]])return LEVEL_ORDER[i];}
  return "C2";
}
function currentLesson(code){
  var lv=currentLevel(code);var ls=allLessons(code,lv);
  for(var i=0;i<ls.length;i++){if(lessonUnlocked(code,lv,i)&&langState(code).doneLessons.indexOf(ls[i].id)<0)return {level:lv,lesson:ls[i]};}
  return {level:lv,lesson:null,exam:true};
}
function progressPct(code){
  var done=0,total=0;LEVEL_ORDER.forEach(function(lv){total+=7;allLessons(code,lv).forEach(function(l){if(langState(code).doneLessons.indexOf(l.id)>=0)done++;});});

}
function markStudy(code,seconds){

  var t=todayStr();st.activity[t]=(st.activity[t]||0)+seconds;st.lastStudyDate=t;
  if(st.streakLast!==t){if(st.streakLast===yesterdayStr())st.streak=(st.streak||0)+1;else if(st.streakLast!==t)st.streak=1;st.streakLast=t;}
  st.streak=st.streak||0;if(st.activity[t]>0&&st.streak===0)st.streak=1;
  if(S.recentLangs.indexOf(code)<0)S.recentLangs.unshift(code);else{S.recentLangs.splice(S.recentLangs.indexOf(code),1);S.recentLangs.unshift(code);}
  S.recentLangs=S.recentLangs.slice(0,4);save();
}

}
function shuffle(arr,seed){
  var a=arr.slice(),s=seed||1;
  function rnd(){s=(s*1103515245+12345)%2147483648;return s/2147483648;}
  for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function pickOptions(correct,pool,n){
  var opts=[correct];var rest=pool.filter(function(x){return x!==correct;});
  rest=shuffle(rest,correct.length*7+3);
  for(var i=0;i<rest.length&&opts.length<n;i++)opts.push(rest[i]);
  return shuffle(opts,opts.length*13+1);
}

var QUIZ=null;
function startQuiz(opts){
  // opts: {code, level, title, skill, questions:[{q, options, answer, skill, explain}], onDone}
  QUIZ={code:opts.code,level:opts.level,title:opts.title,skill:opts.skill||"Mixed",questions:opts.questions,idx:0,answers:[],onDone:opts.onDone||null,lessonId:opts.lessonId||null,examLevel:opts.examLevel||null};
  renderQuiz();
}
function renderQuiz(){
  var q=QUIZ.questions[QUIZ.idx];
  var html=sheetHead(QUIZ.title,"Question "+(QUIZ.idx+1)+" of "+QUIZ.questions.length+" · "+esc(q.skill));
  html+='<div class="progress-track" style="margin:14px 0"><div class="progress-fill" style="width:'+Math.round(QUIZ.idx/QUIZ.questions.length*100)+'%"></div></div>';
  html+='<p style="font-size:18px;color:var(--ink);font-weight:600">'+esc(q.q)+'</p>';
  if(q.play){html+='<button class="btn btn-sm" type="button" onclick="speak('+JSON.stringify(q.play)+','+JSON.stringify(QUIZ.code)+')">Listen</button>';}
  q.options.forEach(function(o,i){html+='<button class="opt" type="button" onclick="answerQuiz('+i+')">'+esc(o)+'</button>';});
  if(q.write){
    html+='<label>Your answer</label><input class="input" id="writeAns" placeholder="Type the word here"><button class="btn btn-primary btn-block" style="margin-top:10px" type="button" onclick="answerWrite()">Check answer</button>';
  }
  openSheet(html,QUIZ.code);
}
function answerQuiz(i){
  var q=QUIZ.questions[QUIZ.idx];var chosen=q.options[i];
  QUIZ.answers.push({q:q,chosen:chosen,correct:chosen===q.answer});
  nextQuiz();
}
function answerWrite(){
  var v=document.getElementById("writeAns").value.trim();
  var q=QUIZ.questions[QUIZ.idx];
  var norm=function(s){return s.toLowerCase().replace(/\s+/g,"");};
  QUIZ.answers.push({q:q,chosen:v,correct:norm(v)===norm(q.answer)});
  nextQuiz();
}
function nextQuiz(){
  QUIZ.idx++;
  if(QUIZ.idx>=QUIZ.questions.length)showResults();else renderQuiz();
}
function showResults(){
  var total=QUIZ.questions.length,correct=0;var weak={};
  QUIZ.answers.forEach(function(a){if(a.correct)correct++;else weak[a.q.skill]=(weak[a.q.skill]||0)+1;});
  var pct=Math.round(correct/total*100);
  var st=langState(QUIZ.code);
  st.testHistory.push({type:QUIZ.title,level:QUIZ.level,score:correct,total:total,date:todayStr(),weak:Object.keys(weak)});
  QUIZ.answers.forEach(function(a){
    var q=a.q;
    if(q.wordId&&a.correct&&st.learnedWords.indexOf(q.wordId)<0)st.learnedWords.push(q.wordId);
  });
  if(QUIZ.lessonId&&st.doneLessons.indexOf(QUIZ.lessonId)<0)st.doneLessons.push(QUIZ.lessonId);
  if(QUIZ.examLevel){st.examScores[QUIZ.examLevel]=pct;if(pct>=70)st.examPass[QUIZ.examLevel]=true;}
  save();markStudy(QUIZ.code,60);
  var weakList=Object.keys(weak);if(!weakList.length)weakList=["None, excellent work"];
  var before=progressPct(QUIZ.code);
  var html=sheetHead("Results: "+QUIZ.title,correct+" of "+total+" correct, "+pct+"%");
  html+='<div style="text-align:center;padding:10px 0">'+ring(pct)+'</div>';
  html+='<h4>Correct answers</h4>';
  var cor=QUIZ.answers.filter(function(a){return a.correct;});
  html+=cor.length?cor.map(function(a){return '<p style="color:var(--ink)">✓ '+esc(a.q.q)+' <strong>'+esc(a.q.answer)+'</strong></p>';}).join(""):'<p>None yet. Review the incorrect answers below and try again.</p>';
  html+='<h4>Incorrect answers</h4>';
  var inc=QUIZ.answers.filter(function(a){return !a.correct;});
  html+=inc.length?inc.map(function(a){return '<p style="color:var(--ink)">✕ '+esc(a.q.q)+'<br><span class="kbd">Your answer: '+esc(a.chosen||"(blank)")+' · Correct: '+esc(a.q.answer)+'</span></p>';}).join(""):'<p>None. Perfect score.</p>';
  html+='<h4>Areas to improve</h4><p>'+esc(weakList.join(", "))+'</p>';
  html+='<h4>Recommended next lessons</h4>';
  var rec=recommendedLessons(QUIZ.code,QUIZ.level,weakList);
  html+=rec.map(function(l){return '<button class="btn btn-block" style="margin:6px 0" type="button" onclick="openLesson('+JSON.stringify(QUIZ.code)+','+JSON.stringify(QUIZ.level)+','+l.idx+')">'+esc(l.title)+'</button>';}).join("");
  html+='<h4>Level progress</h4><p>Overall progress in '+esc(LANG_DB[QUIZ.code].name)+' is now '+before+'%. Level '+QUIZ.level+' exam status: '+(QUIZ.examLevel?(st.examPass[QUIZ.examLevel]?"Passed":"Not yet passed, 70% needed"):"practice only")+'.</p>';
  html+='<button class="btn btn-primary btn-block" type="button" onclick="closeSheet();render()">Done</button>';
  if(QUIZ.onDone)QUIZ.onDone(pct);
  openSheet(html,QUIZ.code);
}
function recommendedLessons(code,level,weak){
  var ls=allLessons(code,level);var out=[];
  if(weak.indexOf("Vocabulary")>=0||weak.indexOf("Spelling")>=0){out.push({idx:0,title:ls[0].title});out.push({idx:1,title:ls[1].title});}
  if(weak.indexOf("Grammar")>=0){out.push({idx:2,title:ls[2].title});}
  if(weak.indexOf("Reading")>=0){out.push({idx:5,title:ls[5].title});}
  if(weak.indexOf("Listening")>=0||weak.indexOf("Speaking")>=0){out.push({idx:6,title:ls[6].title});}
  if(!out.length){var cur=currentLesson(code);out.push({idx:0,title:ls[0].title});if(cur.lesson)out.push({idx:parseInt(cur.lesson.id.split("-L")[1])-1,title:cur.lesson.title});}
  return out.slice(0,3);
}
function vocabQuestions(code,level,n,skills){
  var v=levelData(code,level).vocab;var pool=v.map(function(w){return w.gloss;});var poolW=v.map(function(w){return w.w;});
  var qs=[];
  for(var i=0;i<n;i++){
    var w=v[i%v.length];
    if(i%2===0)qs.push({q:'What does "'+w.w+'" mean?',options:pickOptions(w.gloss,pool,4),answer:w.gloss,skill:skills[0]||"Vocabulary",wordId:w.id});
    else qs.push({q:'Which word means "'+w.gloss+'"?',options:pickOptions(w.w,poolW,4),answer:w.w,skill:skills[0]||"Vocabulary",wordId:w.id});
  }
  return qs;
}
function writingQuestions(code,level,n){
  var v=levelData(code,level).vocab;var qs=[];
  for(var i=0;i<n;i++){var w=v[(i*3)%v.length];qs.push({q:'Type the '+LANG_DB[code].name+' word for: '+w.gloss,options:[],answer:w.w,skill:"Spelling",write:true,wordId:w.id});}
  return qs;
}

function openLesson(code,level,idx){

    html+='<p>Study these words, listen to each one, then take the spelling check to complete the lesson.</p>';
    html+=words.map(function(w){return wordCard(code,w);}).join("");
    html+='<button class="btn btn-primary btn-block" style="margin-top:12px" type="button" onclick="startQuiz({code:'+JSON.stringify(code)+',level:'+JSON.stringify(level)+',title:'+JSON.stringify(meta.title+" check")+',lessonId:'+JSON.stringify(lid)+',questions:writingQuestions('+JSON.stringify(code)+','+JSON.stringify(level)+',5)})">Start spelling check</button>';
  } else if(meta.kind==="grammar"){

    html+='<button class="btn btn-primary btn-block" style="margin-top:12px" type="button" onclick="startQuiz({code:'+JSON.stringify(code)+',level:'+JSON.stringify(level)+',title:'+JSON.stringify(meta.title+" check")+',lessonId:'+JSON.stringify(lid)+',questions:readingQuestions('+JSON.stringify(code)+','+JSON.stringify(level)+')})">Start reading questions</button>';
  } else {
    html+='<p>Listen to each sentence, repeat it aloud, then mark the unit practised. Playback uses your device speech synthesis where supported, and no score is invented for speaking.</p>';

    html+='<p>Repeat each sentence aloud, then tap below.</p><button class="btn btn-primary btn-block" type="button" onclick="completeSpeaking('+JSON.stringify(code)+','+JSON.stringify(lid)+')">I practised this unit</button>';

function completeSpeaking(code,lid){var st=langState(code);if(st.doneLessons.indexOf(lid)<0)st.doneLessons.push(lid);save();markStudy(code,120);closeSheet();toast("Listening and speaking unit complete");render();}
function readingQuestions(code,level){
  var lv=levelData(code,level);var v=lv.vocab;
  var themeOpts=pickOptions(LEVEL_THEMES[level],["greetings, numbers, family, and food","daily life, travel, and work","opinions, culture, and current topics","argumentation and professional life","academic and abstract topics","nuance, idiom, and register"],4);
  return [
    {q:"What is this passage mainly about?",options:themeOpts,answer:LEVEL_THEMES[level],skill:"Reading"},
    {q:'Which sentence opens the passage?',options:shuffle(lv.reading.passage.slice(),3),answer:lv.reading.passage[0],skill:"Reading"},
    {q:'What does "'+v[0].w+'" mean?',options:pickOptions(v[0].gloss,v.map(function(w){return w.gloss;}),4),answer:v[0].gloss,skill:"Vocabulary",wordId:v[0].id}
  ];
}
function levelExamQuestions(code,level){
  var qs=vocabQuestions(code,level,5,["Vocabulary"]);
  qs.push({q:"Which level theme is this? "+LEVEL_THEMES[level],options:["A1","A2","B1","B2","C1","C2"],answer:level,skill:"Grammar"});
  qs=qs.concat(writingQuestions(code,level,2));
  qs=qs.concat(readingQuestions(code,level).slice(0,2));
  return qs.slice(0,10);
}
function openLevelExam(code,level){
  var lv=levelData(code,level);
  var done=allLessons(code,level).every(function(l){return langState(code).doneLessons.indexOf(l.id)>=0;});
  if(!done){toast("Complete all 7 lessons in this level first.");return;}
  startQuiz({code:code,level:level,title:level+" Level Exam",examLevel:level,questions:levelExamQuestions(code,level)});
}
function openCert(certId){
  var cert=CERTS.filter(function(c){return c[0]===certId;})[0];var code=cert[2];
  var qs=vocabQuestions(code,currentLevel(code),5,["Vocabulary"]);
  var st=langState(code);var prog=st.cert[certId]||{correct:0,total:0};
  var html=sheetHead(cert[1]+" preparation","Preparation only. NES:Learn does not issue this certification and has no partnership with the exam body.");
  html+='<p>'+esc(cert[4])+'</p><p><strong>Skill areas:</strong> Listening, Reading, Writing, Speaking. <strong>Recommended level:</strong> '+cert[3]+' and above.</p>';
  html+='<p><strong>Mock exam structure:</strong> timed sections for each skill, with a vocabulary and grammar section first, then reading, listening, and a writing task. Your practice score here is tracked below.</p>';
  html+='<p><strong>Your practice progress:</strong> '+prog.correct+' of '+prog.total+' practice questions correct.</p>';
  html+='<button class="btn btn-primary btn-block" type="button" onclick="startCertQuiz('+JSON.stringify(certId)+')">Start 5 practice questions</button>';
  openSheet(html,code);
}
function startCertQuiz(certId){
  var cert=CERTS.filter(function(c){return c[0]===certId;})[0];var code=cert[2];
  var qs=vocabQuestions(code,currentLevel(code),5,["Vocabulary"]);
  var oldDone=QUIZ?null:null;
  startQuiz({code:code,level:currentLevel(code),title:cert[1]+" practice",questions:qs,onDone:function(pct){
    var st=langState(code);var p=st.cert[certId]||{correct:0,total:0};p.correct+=Math.round(pct/100*5);p.total+=5;st.cert[certId]=p;save();
  }});
}
// ---- Tabs ----
var TAB="home";
function setTab(t){TAB=t;render();}
function tabBtn(t,ic,label){return '<button class="tab '+(TAB===t?'on':'')+'" type="button" onclick="setTab('+JSON.stringify(t)+')">'+icon(ic)+'<span>'+label+'</span></button>';}
function renderTabs(){document.getElementById("tabs").innerHTML=tabBtn("home","home","Home")+tabBtn("learn","book","Learn")+tabBtn("practice","target","Practice")+tabBtn("progress","chart","Progress")+tabBtn("profile","user","Profile");}
function langCard(code){
  var L=LANG_DB[code];var cur=currentLesson(code);var pct=progressPct(code);
  var curText=cur.lesson?cur.lesson.title:(cur.exam?currentLevel(code)+" Level Exam":"Complete");
  return '<button class="card" style="width:100%;text-align:left;color:var(--ink)" type="button" onclick="openLang('+JSON.stringify(code)+')"><div style="display:flex;gap:12px;align-items:center"><div style="flex:1;min-width:0"><div style="font-size:18px;font-weight:700">'+esc(L.name)+'</div><div class="kbd">'+esc(L.native)+' · '+currentLevel(code)+' '+LEVEL_NAMES[currentLevel(code)]+'</div><div style="margin:8px 0" class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="kbd">'+pct+'% complete · Next: '+esc(curText)+'</div></div>'+ring(pct)+'</div></button>';
}
function renderHome(){
  if(!S.name)return renderOnboarding();
  var curLang=S.currentLang;var cur=currentLesson(curLang);
  var todaySecs=langState(curLang).activity[todayStr()]||0;
  var goalMin=S.prefs.dailyGoalMin||20;var dailyPct=Math.min(100,Math.round(todaySecs/60/goalMin*100));
  var html='<h2>Good day, '+esc(S.name)+'</h2><p>Continue where you left off, and keep your streak going.</p>';
  html+='<div class="grid grid2"><div class="card"><div class="kbd">Continue Learning</div><h3 style="margin:6px 0">'+esc(LANG_DB[curLang].name)+' · '+(cur.lesson?esc(cur.lesson.title):esc(currentLevel(curLang)+" Level Exam"))+'</h3><button class="btn btn-primary" type="button" onclick="'+(cur.lesson?'openLesson('+JSON.stringify(curLang)+','+JSON.stringify(cur.level)+','+(parseInt(cur.lesson.id.split("-L")[1])-1)+')':'openLevelExam('+JSON.stringify(curLang)+','+JSON.stringify(cur.level)+')')+'">Continue</button></div>';
  html+='<div class="card"><div class="kbd">Learning streak</div><h3 style="margin:6px 0">'+(langState(curLang).streak||0)+' days</h3><p style="margin:0">Daily goal: '+goalMin+' minutes · Today: '+Math.round(todaySecs/60)+' minutes ('+dailyPct+'%)</p><div class="progress-track" style="margin-top:10px"><div class="progress-fill" style="width:'+dailyPct+'%"></div></div></div></div>';
  html+='<h3>Recently studied languages</h3><div class="grid grid2">'+(S.recentLangs.length?S.recentLangs.map(function(c){return langCard(c);}).join(""):'<p>No study yet. Open Learn and start your first lesson.</p>')+'</div>';
  html+='<h3>Weekly activity</h3><div class="card"><div class="bar">'+last7Days().map(function(d){var secs=0;Object.keys(S.langs).forEach(function(c){secs+=S.langs[c].activity[d]||0;});var mins=Math.round(secs/60);return '<i style="height:'+Math.max(6,Math.min(72,mins*3))+'px" title="'+d+': '+mins+' min"></i>';}).join("")+'</div><div style="display:flex;justify-content:space-between" class="kbd">'+last7Days().map(function(d){return '<span>'+d.slice(5)+'</span>';}).join("")+'</div></div>';
  html+='<h3>Recommended lesson</h3><p>'+(cur.lesson?esc(cur.lesson.title)+' in '+esc(LANG_DB[curLang].name):'Take the '+currentLevel(curLang)+' level exam in '+esc(LANG_DB[curLang].name))+'</p>';
  return html;
}
function last7Days(){var out=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);out.push(todayStr(d));}return out;}
function renderOnboarding(){
  return '<div class="card" style="max-width:520px;margin:60px auto;text-align:center"><div class="logo-mark" style="margin:0 auto 14px;width:56px;height:56px">'+ICON_MARK+'</div><h2>What should we call you?</h2><p>Enter your name only. No email or password is needed.</p><label style="text-align:left" for="nameIn">Your name</label><input class="input" id="nameIn" placeholder="Your name"><button class="btn btn-primary btn-block" style="margin-top:14px" type="button" onclick="saveName()">Continue</button></div>';
}
function saveName(){var v=document.getElementById("nameIn").value.trim();if(!v){toast("Please enter your name");return;}S.name=v;save();renderWelcome();}
function renderWelcome(){
  document.getElementById("app").innerHTML='<div class="card" style="max-width:520px;margin:60px auto;text-align:center"><h2>Welcome to NES:Learn, '+esc(S.name)+'.</h2><p>Your name is saved on this device. Pick a language and start with Lesson 1.</p><button class="btn btn-primary btn-block" type="button" onclick="setTab(\'learn\')">Start learning</button></div>';
}
function renderLearn(){
  var html='<h2>Learn</h2><p>Your selected languages. Progress is tracked separately for each language.</p><div class="grid grid2">'+S.selected.map(function(c){return langCard(c);}).join("")+'</div>';
  html+='<h3>Add a language</h3><div style="display:flex;flex-wrap:wrap;gap:8px">'+Object.keys(LANG_DB).filter(function(c){return S.selected.indexOf(c)<0;}).map(function(c){return '<button class="btn btn-sm" type="button" onclick="addLang('+JSON.stringify(c)+')">+ '+esc(LANG_DB[c].name)+'</button>';}).join("")+'</div>';
  return html;
}
function addLang(c){S.selected.push(c);S.currentLang=c;save();render();toast(LANG_DB[c].name+" added");}
function openLang(code){
  S.currentLang=code;save();
  var L=LANG_DB[code];var cur=currentLesson(code);
  var html='<button class="btn btn-sm" type="button" onclick="setTab(\'learn\')">← All languages</button>';
  html+='<h2>'+esc(L.name)+'</h2><p>'+esc(L.native)+' · Current level: '+currentLevel(code)+' '+LEVEL_NAMES[currentLevel(code)]+' · '+progressPct(code)+'% complete</p>';
  html+='<div class="card"><div class="kbd">Continue Learning</div><h3 style="margin:6px 0">'+(cur.lesson?esc(cur.lesson.title):esc(currentLevel(code)+" Level Exam"))+'</h3><button class="btn btn-primary" type="button" onclick="'+(cur.lesson?'openLesson('+JSON.stringify(code)+','+JSON.stringify(cur.level)+','+(parseInt(cur.lesson.id.split("-L")[1])-1)+')':'openLevelExam('+JSON.stringify(code)+','+JSON.stringify(cur.level)+')')+'">Continue</button></div>';
  html+='<h3>Learning Path</h3>';
  LEVEL_ORDER.forEach(function(lv){
    var locked=!levelUnlocked(code,lv);
    html+='<details '+(lv===currentLevel(code)?'open':'')+'><summary>'+lv+' '+LEVEL_NAMES[lv]+(locked?' · Locked':'')+'</summary><p>'+esc(LEVEL_THEMES[lv])+'.</p>';
    allLessons(code,lv).forEach(function(l,idx){
      var done=langState(code).doneLessons.indexOf(l.id)>=0;
      var un=lessonUnlocked(code,lv,idx);
      html+='<button class="lesson-row" '+(un?'':'disabled')+' type="button" onclick="openLesson('+JSON.stringify(code)+','+JSON.stringify(lv)+','+idx+')"><span>'+(done?icon("check"):un?icon("play"):icon("lock"))+'</span><span class="t"><b>'+esc(l.title)+'</b><span>'+esc(l.kindLabel)+(done?' · Completed':un?' · Ready':' · Locked')+'</span></span></button>';
    });
    html+='<button class="btn btn-block" style="margin-top:10px" type="button" onclick="openLevelExam('+JSON.stringify(code)+','+JSON.stringify(lv)+')">'+lv+' Level Exam (10 questions, pass 70%)</button></details>';
  });
  html+='<h3>Vocabulary</h3>';
  LEVEL_ORDER.forEach(function(lv){html+='<details><summary>'+lv+' vocabulary, '+levelData(code,lv).vocab.length+' words</summary>'+levelData(code,lv).vocab.map(function(w){return wordCard(code,w);}).join("")+'</details>';});
  html+='<h3>Grammar</h3>';
  LEVEL_ORDER.forEach(function(lv){html+='<details><summary>'+lv+' grammar</summary>'+levelData(code,lv).grammar.map(function(g){return '<h4>'+esc(g.title)+'</h4><p>'+esc(g.body)+'</p>';}).join("")+'</details>';});
  html+='<h3>Pronunciation</h3><div class="card"><p>'+esc(L.scriptNote)+'</p><p>Tap Listen on any word to hear it with your device speech synthesis where supported.</p></div>';
  html+='<h3>Listening and Speaking</h3><p>Open any Listening and Speaking lesson in the path to practise with playback and repeat prompts.</p>';
  html+='<h3>Tests</h3><div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn btn-sm" type="button" onclick="startQuiz({code:'+JSON.stringify(code)+',level:'+JSON.stringify(currentLevel(code))+',title:\'Quick Quiz\',questions:vocabQuestions('+JSON.stringify(code)+','+JSON.stringify(currentLevel(code))+',5,[\'Vocabulary\'])})">Quick Quiz</button><button class="btn btn-sm" type="button" onclick="startQuiz({code:'+JSON.stringify(code)+',level:'+JSON.stringify(currentLevel(code))+',title:\'Vocabulary Test\',questions:vocabQuestions('+JSON.stringify(code)+','+JSON.stringify(currentLevel(code))+',10,[\'Vocabulary\'])})">Vocabulary Test</button><button class="btn btn-sm" type="button" onclick="startQuiz({code:'+JSON.stringify(code)+',level:'+JSON.stringify(currentLevel(code))+',title:\'Writing Test\',questions:writingQuestions('+JSON.stringify(code)+','+JSON.stringify(currentLevel(code))+',5)})">Writing Test</button></div>';
  html+='<h3>Certification Preparation</h3><p class="note">Preparation only. NES:Learn does not issue these certifications and has no partnership with the exam bodies.</p>';
  CERTS.filter(function(c){return c[2]===code;}).forEach(function(c){html+='<button class="card" style="width:100%;text-align:left;color:var(--ink);margin:8px 0" type="button" onclick="openCert('+JSON.stringify(c[0])+')"><b>'+esc(c[1])+'</b><p style="margin:4px 0 0">'+esc(c[4])+'</p></button>';});
  if(!CERTS.filter(function(c){return c[2]===code;}).length)html+='<p>No exam body covers this language, so this language uses the structured proficiency pathway instead.</p>';
  document.getElementById("app").innerHTML=html;renderTabs();
}
function renderPractice(){
  var code=S.currentLang;var lv=currentLevel(code);
  var html='<h2>Practice</h2><p>Practising '+esc(LANG_DB[code].name)+' · Level '+lv+'</p>';
  html+='<label>Practice language</label><div style="display:flex;flex-wrap:wrap;gap:8px">'+S.selected.map(function(c){return '<button class="btn btn-sm" type="button" onclick="S.currentLang='+JSON.stringify(c)+';save();render()">'+esc(LANG_DB[c].name)+(c===code?' ✓':'')+'</button>';}).join("")+'</div>';
  var btn=function(t,fn){return '<button class="card" style="width:100%;text-align:left;color:var(--ink)" type="button" onclick="'+fn+'"><b>'+t+'</b></button>';};
  html+='<div class="grid grid2" style="margin-top:14px">';
  html+=btn("Vocabulary practice","startQuiz({code:'"+code+"',level:'"+lv+"',title:'Vocabulary Practice',questions:vocabQuestions('"+code+"','"+lv+"',8,['Vocabulary'])})");
  html+=btn("Grammar practice","startQuiz({code:'"+code+"',level:'"+lv+"',title:'Grammar Practice',questions:vocabQuestions('"+code+"','"+lv+"',6,['Grammar'])})");
  html+=btn("Listening practice","startListeningPractice()");
  html+=btn("Speaking practice","openLesson('"+code+"','"+lv+"',6)");
  html+=btn("Daily challenge","startDailyChallenge()");
  html+=btn("Practice exam","startQuiz({code:'"+code+"',level:'"+lv+"',title:'Practice Exam',questions:levelExamQuestions('"+code+"','"+lv+"')})");
  html+='</div>';
  return html;
}
function startListeningPractice(){
  var code=S.currentLang;var lv=currentLevel(code);var v=levelData(code,lv).vocab.slice(0,5);
  var qs=v.map(function(w){return {q:"Listen, then choose the meaning of the word you hear.",options:pickOptions(w.gloss,levelData(code,lv).vocab.map(function(x){return x.gloss;}),4),answer:w.gloss,skill:"Listening",wordId:w.id,play:w.w};});
  startQuiz({code:code,level:lv,title:"Listening Practice",questions:qs});
}
function startDailyChallenge(){
  var code=S.currentLang;var lv=currentLevel(code);
  var seed=0;var ds=todayStr();for(var i=0;i<ds.length;i++)seed+=ds.charCodeAt(i);
  var v=shuffle(levelData(code,lv).vocab,seed).slice(0,8);
  var qs=v.map(function(w,ix){return ix%2===0?{q:'What does "'+w.w+'" mean?',options:pickOptions(w.gloss,levelData(code,lv).vocab.map(function(x){return x.gloss;}),4),answer:w.gloss,skill:"Vocabulary",wordId:w.id}:{q:'Type the '+LANG_DB[code].name+' word for: '+w.gloss,options:[],answer:w.w,skill:"Spelling",write:true,wordId:w.id};});
  startQuiz({code:code,level:lv,title:"Daily Challenge",questions:qs});
}
function renderProgress(){
  var totalLessons=0,doneLessons=0,totalSecs=0,totalTests=0,totalScore=0,totalQ=0,totalLearned=0;
  Object.keys(S.langs).forEach(function(c){var st=S.langs[c];doneLessons+=st.doneLessons.length;totalSecs+=st.studySeconds;st.testHistory.forEach(function(t){totalTests++;totalScore+=t.score;totalQ+=t.total;});totalLearned+=st.learnedWords.length;});
  totalLessons=Object.keys(LANG_DB).length*42;
  var html='<h2>Progress</h2><div class="stat"><div class="card"><b>'+doneLessons+' / '+totalLessons+'</b><span>Lessons completed</span></div><div class="card"><b>'+Math.round(totalSecs/60)+' min</b><span>Study time</span></div><div class="card"><b>'+(totalQ?Math.round(totalScore/totalQ*100):0)+'%</b><span>Average test score ('+totalTests+' tests)</span></div><div class="card"><b>'+totalLearned+'</b><span>Words learned</span></div></div>';
  html+='<h3>Progress for every language</h3><div class="grid grid2">'+Object.keys(LANG_DB).map(function(c){return '<div class="card"><b>'+esc(LANG_DB[c].name)+'</b><p style="margin:4px 0">Level '+currentLevel(c)+' · '+langState(c).doneLessons.length+' lessons · Streak '+(langState(c).streak||0)+' days</p><div class="progress-track"><div class="progress-fill" style="width:'+progressPct(c)+'%"></div></div><div class="kbd">'+progressPct(c)+'% complete</div></div>';}).join("")+'</div>';
  html+='<h3>Test history</h3>';
  var hist=[];Object.keys(S.langs).forEach(function(c){S.langs[c].testHistory.forEach(function(t){hist.push({c:c,t:t});});});
  hist=hist.slice(-20).reverse();
  html+=hist.length?hist.map(function(h){return '<p>'+esc(h.t.date)+' · '+esc(LANG_DB[h.c].name)+' · '+esc(h.t.type)+' · '+h.t.score+'/'+h.t.total+'</p>';}).join(""):'<p>No tests taken yet.</p>';
  return html;
}
function renderProfile(){
  var html='<h2>Profile</h2><div class="card"><label for="nameEdit">Your name</label><input class="input" id="nameEdit" value="'+esc(S.name)+'"><button class="btn btn-primary" style="margin-top:10px" type="button" onclick="S.name=document.getElementById(\'nameEdit\').value.trim()||S.name;save();toast(\'Name saved\');render()">Save name</button></div>';
  html+='<h3>Selected languages</h3><div class="card">'+Object.keys(LANG_DB).map(function(c){var on=S.selected.indexOf(c)>=0;return '<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" '+(on?'checked':'')+' onchange="toggleLang('+JSON.stringify(c)+',this.checked)"> '+esc(LANG_DB[c].name)+'</label>';}).join("")+'<p class="note">At least one language must stay selected.</p></div>';
  html+='<h3>Preferences</h3><div class="card"><label>Theme</label><select class="input" id="themeSel" onchange="S.prefs.theme=this.value;save();render()"><option value="light" '+(S.prefs.theme==="light"?'selected':'')+'>Light</option><option value="dark" '+(S.prefs.theme==="dark"?'selected':'')+'>Dark</option></select><label>Daily goal (minutes)</label><input class="input" type="number" min="5" max="180" id="goalIn" value="'+(S.prefs.dailyGoalMin||20)+'"><button class="btn" style="margin-top:10px" type="button" onclick="S.prefs.dailyGoalMin=parseInt(document.getElementById(\'goalIn\').value)||20;save();render()">Save goal</button><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" '+(S.prefs.voice?'checked':'')+' onchange="S.prefs.voice=this.checked;save()"> Spoken playback where supported</label></div>';
  html+='<h3>Local data controls</h3><div class="card" style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" type="button" onclick="exportData()">Export data as JSON</button><label class="btn" style="cursor:pointer">Import JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label><button class="btn" type="button" onclick="if(confirm(\'Clear all NES:Learn data on this device? This cannot be undone.\')){localStorage.removeItem(LS_KEY);location.reload();}">Clear all local data</button></div>';
  return html;
}
function toggleLang(c,on){
  if(on){if(S.selected.indexOf(c)<0)S.selected.push(c);}
  else{if(S.selected.length<=1){toast("Keep at least one language selected");render();return;}S.selected.splice(S.selected.indexOf(c),1);if(S.currentLang===c)S.currentLang=S.selected[0];}
  save();render();
}
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nes-learn-data.json";a.click();toast("Data exported");
}
function importData(input){
  var f=input.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d||typeof d!=="object"||!d.langs)throw 0;S=d;save();toast("Data imported");render();}catch(e){toast("That file is not NES:Learn data");}};
  r.readAsText(f);
}
function render(){
  renderTabs();
  if(!S.name){document.getElementById("app").innerHTML=renderOnboarding();return;}
  var html="";
  if(TAB==="home")html=renderHome();
  else if(TAB==="learn")html=renderLearn();
  else if(TAB==="practice")html=renderPractice();
  else if(TAB==="progress")html=renderProgress();
  else if(TAB==="profile")html=renderProfile();
  document.getElementById("app").innerHTML=html;
}
document.getElementById("themeBtn").addEventListener("click",function(){S.prefs.theme=S.prefs.theme==="dark"?"light":"dark";save();render();});
applyTheme();
render();
window.NESLearnTest={getState:function(){return S;},LANG_DB:LANG_DB,currentLesson:currentLesson,progressPct:progressPct,levelUnlocked:levelUnlocked};

</script>
